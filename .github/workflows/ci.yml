name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Stops the build when a package that the app sends to its users has a known high or critical
      # vulnerability. Development tools are checked as well, but only reported: a new warning about
      # a test tool should not block a pull request.
      - name: Check the packages of the app for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Check the development tools (report only)
        run: npm audit
        continue-on-error: true

      - run: npm run lint
      # Runs the unit tests and fails if they cover less code than the limits in vite.config.js
      - run: npm run test:coverage
      - run: npm run build
        env:
          # The build only needs placeholders; nothing is sent to Supabase
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  e2e:
    name: End-to-end tests (local Supabase)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Starts Postgres, Auth, REST and Realtime in Docker and applies supabase/migrations.
      # Services the app does not use are excluded to make the start faster. Mailpit stays: the password reset tests read the emails from it.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Create .env.localdb from the running Supabase
        run: |
          npx supabase status -o env > supabase.env
          API_URL=$(grep '^API_URL=' supabase.env | cut -d= -f2- | tr -d '"')
          ANON_KEY=$(grep '^ANON_KEY=' supabase.env | cut -d= -f2- | tr -d '"')
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env.localdb
          rm supabase.env

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          CI: true
          E2E_BROWSER: chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
