name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # The build only needs placeholders; nothing is sent to Supabase
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  e2e:
    name: End-to-end tests (local Supabase)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Starts Postgres, Auth, REST and Realtime in Docker and applies supabase/migrations.
      # Services the app does not use are excluded to make the start faster.
      - name: Start local Supabase
        run: npx supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Create .env.localdb from the running Supabase
        run: |
          npx supabase status -o env > supabase.env
          API_URL=$(grep '^API_URL=' supabase.env | cut -d= -f2- | tr -d '"')
          ANON_KEY=$(grep '^ANON_KEY=' supabase.env | cut -d= -f2- | tr -d '"')
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env.localdb
          rm supabase.env

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          CI: true
          E2E_BROWSER: chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
